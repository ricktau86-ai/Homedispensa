<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispensa</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="tc" content="#eef1f8">
<meta name="color-scheme" content="light dark">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dispensa-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root {
  color-scheme: light;
  --bg: #eef1f8;
  --surface: #ffffff;
  --surface-2: #e7ebf5;
  --line: #d3daea;
  --text: #0a1330;
  --muted: #5a6585;
  --faint: #98a2bf;
  --navy: #14214f;
  --red: #e4002b;
  --red-2: #ff2d4d;
  --yellow: #ffc400;
  --blue: #1e3a9e;
  --blue-2: #2b4fd0;
  --danger: #e4002b;
  --danger-soft: rgba(228,0,43,.1);
  --on-yellow: #1a1300;
  --input-bg: #f4f6fc;
  --lines: rgba(20,33,79,.045);
  --card-grad: linear-gradient(160deg, #ffffff, #f4f6fc);
  --shadow: 0 1px 0 rgba(20,33,79,.06), 0 8px 22px rgba(20,33,79,.09);
  --shadow-lg: 0 16px 50px rgba(10,19,48,.3);
  --hdr-bg: rgba(238,241,248,.9);
  --stripe: linear-gradient(90deg, var(--red) 0 56%, var(--yellow) 56% 63%, var(--navy) 63% 100%);
  --display: "Arial Black", "Segoe UI Black", "Helvetica Neue", Roboto, system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #050816;
  --surface: #0e1630;
  --surface-2: #17224a;
  --line: #26356b;
  --text: #f4f6ff;
  --muted: #9ba7d2;
  --faint: #5f6d9d;
  --navy: #2a3f94;
  --red: #ff1f3d;
  --red-2: #ff5570;
  --yellow: #ffd21f;
  --blue: #4a73ff;
  --blue-2: #7b9bff;
  --danger: #ff5570;
  --danger-soft: rgba(255,85,112,.15);
  --input-bg: #070d22;
  --lines: rgba(255,255,255,.035);
  --card-grad: linear-gradient(160deg, #121c3d, #0b1330);
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.5);
  --shadow-lg: 0 16px 50px rgba(0,0,0,.8);
  --hdr-bg: rgba(5,8,22,.88);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.35; overscroll-behavior: none; min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
/* riscas de velocidade (estáticas, sem custo) */
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(-62deg, transparent 0 46px, var(--lines) 46px 49px, transparent 49px 120px); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; font-size: 16px; }
button, .item, .tile { user-select: none; -webkit-user-select: none; }
svg.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.it { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; z-index: 1; }

/* ---------- Header ---------- */
.hdr { position: sticky; top: 0; z-index: 20; padding: calc(var(--safe-t) + 14px) 18px 14px; background: var(--hdr-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.hdr::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--stripe); clip-path: polygon(0 0, 100% 0, 100% 100%, 2.5% 100%); }
.hdr-row { display: flex; align-items: center; gap: 10px; }
.hdr h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 23px; letter-spacing: -.02em; line-height: 1.05; }
.hdr h1 em { font-style: italic; color: var(--red); }
.hdr p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.grow { flex: 1; min-width: 0; }
.ibtn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--text); box-shadow: var(--shadow); transition: transform .12s; flex: none; transform: skewX(-8deg); }
.ibtn svg { transform: skewX(8deg); }
.ibtn:active { transform: skewX(-8deg) scale(.92); }
.ibtn.on { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.logo { width: 50px; height: 50px; border-radius: 14px; object-fit: cover; box-shadow: 0 6px 16px rgba(228,0,43,.35); flex: none; }
.dot { width: 14px; height: 14px; border-radius: 3px; transform: skewX(-20deg); flex: none; }
.progress { position: relative; height: 8px; border-radius: 3px; background: var(--surface-2); margin-top: 12px; overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--yellow)); transition: width .35s ease; }
.progress::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 22px; background: conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0/8px 8px; opacity: .85; }

/* ---------- Main ---------- */
main { padding: 16px 18px calc(210px + var(--safe-b)); animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }

.hero { width: 100%; text-align: left; padding: 22px 20px 18px; border-radius: 20px; color: #fff; position: relative; overflow: hidden; isolation: isolate;
  background: linear-gradient(125deg, #070f33 0%, #12236e 60%, #1e3a9e 100%); box-shadow: 0 14px 34px rgba(20,33,100,.35); transition: transform .12s; }
.hero:active { transform: scale(.985); }
.hero::before { content: ""; position: absolute; z-index: -1; right: -30px; top: -20px; width: 60%; height: 140%; background: linear-gradient(90deg, var(--red) 0 38%, transparent 38% 56%, var(--red) 56% 78%, transparent 78%); transform: skewX(-24deg); opacity: .95; }
.lights { position: absolute; right: 16px; top: 16px; display: flex; gap: 5px; padding: 6px; background: #0b0b10; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 8px 18px rgba(0,0,0,.4); overflow: hidden; }
.lights i { position: relative; width: 18px; height: 40px; border-radius: 6px; background: #17171f; }
.lights i::before, .lights i::after { content: ""; position: absolute; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff9aa6, #ff1f3d 55%, #b3001f); box-shadow: 0 0 10px 2px rgba(255,31,61,.85); }
.lights i::before { top: 4px; } .lights i::after { bottom: 4px; }
/* partida de F1: um temporizador em JS liga as luzes 1 a 1 (classe .on), faz "lights out" (.out) e deixa-as acesas */
.lights.seq i::before, .lights.seq i::after { opacity: .12; box-shadow: none; transition: opacity .06s; }
.lights.seq i.on::before, .lights.seq i.on::after { opacity: 1; box-shadow: 0 0 10px 2px rgba(255,31,61,.85); }
.hero small { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); }
.hero .big { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.hero .big b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 70px; line-height: 1; letter-spacing: -.04em; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
.hero .big span { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; max-width: 120px; line-height: 1.15; }
.hero .bar { position: relative; height: 9px; background: rgba(255,255,255,.2); border-radius: 3px; margin-top: 16px; overflow: hidden; }
.hero .bar i { display: block; height: 100%; background: linear-gradient(90deg, #fff, var(--yellow)); transition: width .4s; }
.hero .bar::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 24px; background: conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0/9px 9px; }
.hero .sub { font-size: 12px; font-weight: 700; opacity: .92; margin-top: 8px; }

.sec { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 12px; }
.sec h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 15px; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.sec h2::before { content: ""; width: 20px; height: 12px; background: linear-gradient(90deg, var(--red) 0 40%, transparent 40% 60%, var(--red) 60%); transform: skewX(-24deg); }
.sec.b h2::before { background: linear-gradient(90deg, var(--yellow) 0 40%, transparent 40% 60%, var(--yellow) 60%); }
.link { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #fff; padding: 9px 16px; border-radius: 8px; background: var(--red); transform: skewX(-10deg); box-shadow: 0 6px 14px rgba(228,0,43,.3); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile-wrap { position: relative; }
.tile { --c: #64748b; width: 100%; text-align: left; padding: 14px; min-height: 138px; border-radius: 16px; position: relative; overflow: hidden;
  background: var(--card-grad); border: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s; animation: pop .25s ease both; }
.tile::before { content: ""; position: absolute; left: -10px; top: 0; bottom: 0; width: 22px; background: var(--c); transform: skewX(-12deg); }
.tile:active { transform: scale(.96); }
.tile .top { display: flex; justify-content: space-between; align-items: flex-start; padding-left: 12px; position: relative; }
.corner { display: flex; flex-direction: column; line-height: 1; }
.corner b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 32px; color: var(--c); letter-spacing: -.03em; }
.corner i { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin-top: 2px; }
.tile .wm { position: absolute; right: 6px; bottom: -14px; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 84px; line-height: 1; color: var(--c); opacity: .13; pointer-events: none; }
.tile .name { margin-left: 12px; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.tile .meta { margin-left: 12px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; position: relative; }
.tile .meta.ok { color: var(--blue-2); }
.count { min-width: 30px; height: 30px; padding: 0 9px; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 15px; background: var(--c); color: #fff; transform: skewX(-10deg); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
.tile.dashed { background: transparent; border: 2px dashed var(--line); box-shadow: none; align-items: center; justify-content: center; color: var(--muted); gap: 6px; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 13px; }
.tile.dashed::before { display: none; }
.tile.dashed:hover { color: var(--red); border-color: var(--red); }
.tile.dashed svg { width: 30px; height: 30px; }
.del-badge { position: absolute; top: -8px; right: -8px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow); border: 2px solid var(--bg); animation: pop .2s ease; }
.hint { background: rgba(255,196,0,.18); border: 1px solid var(--yellow); border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 700; color: var(--text); display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }

/* ---------- Items ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { --c: #64748b; background: var(--card-grad); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 12px 12px 22px; position: relative; overflow: hidden; animation: pop .22s ease both; transition: opacity .2s; }
.item::before { content: ""; position: absolute; left: -6px; top: 0; bottom: 0; width: 14px; background: var(--c); transform: skewX(-12deg); }
.item.done { box-shadow: none; background: transparent; opacity: .55; }
.item-row { display: flex; align-items: center; gap: 12px; }
.chk { width: 32px; height: 32px; border-radius: 8px; border: 2.5px solid var(--faint); display: grid; place-items: center; transition: all .15s; flex: none; transform: skewX(-8deg); background: var(--surface); }
.chk:active { transform: skewX(-8deg) scale(.88); }
.chk svg { display: none; }
.item.done .chk { border-color: var(--text); background: conic-gradient(#0a1330 25%, #fff 0 50%, #0a1330 0 75%, #fff 0) 0 0/10px 10px; }
.body { flex: 1; min-width: 0; cursor: pointer; padding: 2px 0; }
.iname { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.item.done .iname { text-decoration: line-through; color: var(--muted); }
.imeta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pill { font-size: 10px; font-weight: 900; font-style: italic; letter-spacing: .05em; text-transform: uppercase; padding: 2px 9px; border-radius: 4px; color: #fff; transform: skewX(-10deg); }
.qty { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 12px; padding: 3px; flex: none; }
.qty button { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.qty button:active { transform: scale(.88); }
.qty button:disabled { opacity: .35; box-shadow: none; }
.qty button.plus { background: var(--red); color: #fff; }
.qty .v { min-width: 44px; text-align: center; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 18px; line-height: 1; }
.qty .v small { display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-style: normal; font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; margin-top: 2px; }
.detail { display: flex; gap: 8px; margin-top: 10px; padding-left: 44px; animation: fade .2s ease; }
.detail input { flex: 1; min-width: 0; background: var(--input-bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; font-size: 15px; }
.detail input:focus { border-color: var(--blue-2); }
.detail .rm { width: 44px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); font-weight: 600; }
.empty .circle { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 20px; display: grid; place-items: center; background: var(--surface); color: var(--red); border: 4px solid var(--yellow); box-shadow: 0 10px 28px rgba(255,196,0,.35); }
.empty .circle svg { width: 40px; height: 40px; }
.empty b { display: block; color: var(--text); font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 20px; margin-bottom: 4px; }

/* ---------- Composer ---------- */
.composer-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none; }
.composer { pointer-events: auto; max-width: 560px; margin: 0 auto; padding: 16px 14px calc(12px + var(--safe-b)); position: relative;
  background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(10,19,48,.22); border: 1px solid var(--line); border-bottom: 0; }
.composer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--stripe); border-radius: 20px 20px 0 0; clip-path: polygon(0 0, 100% 0, 97.5% 100%, 0 100%); }
.composer.listening { box-shadow: 0 -10px 40px rgba(228,0,43,.4); }
.crow { display: flex; align-items: center; gap: 8px; }
.cin { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--input-bg); border-radius: 12px; border: 1.5px solid var(--line); transition: border-color .15s; }
.cin:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(228,0,43,.15); }
.cin input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 14px 14px; font-weight: 700; }
.cin input::placeholder { color: var(--faint); font-weight: 600; }
.mic { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; background: var(--yellow); color: var(--on-yellow); flex: none; transition: all .15s; box-shadow: 0 6px 16px rgba(255,196,0,.4); transform: skewX(-8deg); }
.mic svg, .send svg { transform: skewX(8deg); }
.mic:active { transform: skewX(-8deg) scale(.92); }
.mic.on { background: var(--red); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(228,0,43,.6); } 70% { box-shadow: 0 0 0 14px rgba(228,0,43,0); } 100% { box-shadow: 0 0 0 0 rgba(228,0,43,0); } }
.send { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; background: var(--red); color: #fff; flex: none; box-shadow: 0 6px 18px rgba(228,0,43,.42); transition: transform .12s; transform: skewX(-8deg); }
.send svg { stroke-width: 3.2; }
.send:active { transform: skewX(-8deg) scale(.9); }
.send:disabled { opacity: .45; }
.opts { display: flex; align-items: center; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.opts::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 9px; padding: 3px; flex: none; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
.seg input:checked + span { background: var(--navy); color: #fff; }
.chip { flex: none; padding: 7px 13px; border-radius: 7px; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--muted); border: 1.5px solid transparent; white-space: nowrap; }
.chip.sel { color: #fff; }
.listen-msg { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; color: var(--red); padding: 0 4px 10px; text-transform: uppercase; font-style: italic; }

/* ---------- Sheet / Toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5,8,22,.62); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: fadeo .2s ease; }
@keyframes fadeo { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 12px 22px calc(22px + var(--safe-b)); box-shadow: var(--shadow-lg); animation: up .25s cubic-bezier(.2,.8,.2,1); position: relative; }
.sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--stripe); border-radius: 22px 22px 0 0; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 16px; }
.sheet h3 { margin: 0 0 4px; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 22px; letter-spacing: -.01em; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.sheet label.lbl { display: block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--red); margin: 18px 0 8px; }
.sheet input[type=text] { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--input-bg); outline: none; font-weight: 700; }
.sheet input[type=text]:focus { border-color: var(--red); }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 10px; border: 3px solid transparent; transition: transform .12s; transform: skewX(-8deg); }
.sw.sel { border-color: var(--text); transform: skewX(-8deg) scale(1.1); }
.btns { display: flex; gap: 10px; margin-top: 22px; }
.btn { flex: 1; padding: 15px; border-radius: 12px; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 14px; background: var(--surface-2); }
.btn.primary { background: var(--red); color: #fff; box-shadow: 0 8px 18px rgba(228,0,43,.35); }
.btn.danger { background: var(--red); color: #fff; box-shadow: 0 8px 18px rgba(228,0,43,.35); }
.warn { width: 56px; height: 56px; border-radius: 14px; transform: skewX(-10deg); background: rgba(255,196,0,.2); border: 2px solid var(--yellow); color: var(--text); display: grid; place-items: center; margin: 8px 0 18px 6px; }
.warn svg { width: 26px; height: 26px; transform: skewX(10deg); }

.toast { position: fixed; left: 50%; bottom: calc(190px + var(--safe-b)); transform: translateX(-50%); z-index: 60; background: var(--navy); color: #fff;
  padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-lg); animation: up .25s ease; max-width: calc(100% - 28px); border-left: 6px solid var(--yellow); }
.toast button { font-family: var(--display); font-style: italic; font-weight: 900; color: var(--yellow); text-transform: uppercase; font-size: 12px; }
.toast.err { background: var(--red); border-left-color: #fff; }
.loading { display: grid; place-items: center; height: 100vh; }
.spin { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--surface-2); border-top-color: var(--red); border-right-color: var(--yellow); animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.offline { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; padding: 6px; border-radius: 8px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div id="main"><div class="loading"><div class="spin"></div></div></div>
  <div class="composer-wrap"><div id="composer"></div></div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, updateDoc, addDoc, setDoc, deleteDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// ---------------- Firebase (mesma base de dados de sempre) ----------------
const firebaseConfig = {
  apiKey: "AIzaSyCj1DvIHJTU6nYimJnOJYs5KgHX0_M37vw",
  authDomain: "dispensahome-40379.firebaseapp.com",
  projectId: "dispensahome-40379",
  storageBucket: "dispensahome-40379.firebasestorage.app",
  messagingSenderId: "834278967482",
  appId: "1:834278967482:web:8b53dce26d3e4a3f43da83",
  measurementId: "G-6Q0LRLTWT8"
};
const appId = typeof __app_id !== 'undefined' ? __app_id : 'minha-casa';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  // cache local: a app abre e funciona sem rede e sincroniza quando voltar
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { db = getFirestore(app); }

const base = ['artifacts', appId, 'public', 'data'];
const itemsCol = () => collection(db, ...base, 'dispensa_items');
const storesCol = () => collection(db, ...base, 'dispensa_stores');
const itemDoc = (id) => doc(db, ...base, 'dispensa_items', id);
const storeDoc = (id) => doc(db, ...base, 'dispensa_stores', id);
const metaDoc = () => doc(db, ...base, 'dispensa_metadata', 'status');

// ---------------- Estado ----------------
const state = {
  items: [], stores: [], loading: true, lastUpdate: null,
  view: 'dashboard', edit: false, newItemStore: 'geral', unit: 'unid',
  expanded: null, listening: false, recognition: null, modal: null, online: navigator.onLine,
  itemsReady: false, storesReady: false
};

// As cores das lojas ficam guardadas como classes (ex.: "bg-red-600") para manter compatibilidade com os dados existentes
const COLORS = [
  { name: 'Vermelho', cls: 'bg-red-600', hex: '#dc2626' }, { name: 'Laranja', cls: 'bg-orange-500', hex: '#f97316' },
  { name: 'Âmbar', cls: 'bg-amber-500', hex: '#f59e0b' }, { name: 'Verde', cls: 'bg-green-600', hex: '#16a34a' },
  { name: 'Esmeralda', cls: 'bg-emerald-500', hex: '#10b981' }, { name: 'Ciano', cls: 'bg-cyan-600', hex: '#0891b2' },
  { name: 'Azul', cls: 'bg-blue-600', hex: '#2563eb' }, { name: 'Índigo', cls: 'bg-indigo-600', hex: '#4f46e5' },
  { name: 'Roxo', cls: 'bg-purple-600', hex: '#9333ea' }, { name: 'Rosa', cls: 'bg-pink-600', hex: '#db2777' },
  { name: 'Ardósia', cls: 'bg-slate-600', hex: '#475569' }, { name: 'Preto', cls: 'bg-slate-900', hex: '#334155' }
];
const colorHex = (cls) => (COLORS.find(c => c.cls === String(cls).split(' ')[0]) || { hex: '#64748b' }).hex;
const GENERAL_HEX = '#8a93a6';

const NUMBER_WORDS = { um: 1, uma: 1, dois: 2, duas: 2, 'três': 3, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, 'dúzia': 12, duzia: 12 };

// ---------------- Ícones (SVG inline, funcionam offline) ----------------
const P = {
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  cog: '<path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
  micoff: '<path d="m2 2 20 20"/><path d="M18.9 13A7 7 0 0 0 19 12v-2M5 10v2a7 7 0 0 0 12 5M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1M12 19v3"/>',
  back: '<path d="m15 18-6-6 6-6"/>', trash: '<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/>',
  cart: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>', note: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  wifioff: '<path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2.4-1.9M12 20h.01"/>'
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

// ---------------- Utilitários ----------------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const isSpecific = () => state.view !== 'dashboard' && state.view !== 'all';
const storeById = (id) => state.stores.find(s => s.id === id);
const storeOf = (item) => storeById(item.supermarket) || null;
const inView = (item, view) => view === 'all' || view === 'dashboard' ? true : view === 'geral' ? !storeOf(item) : item.supermarket === view;
const countOpen = (view) => state.items.filter(i => !i.isBought && inView(i, view)).length;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function fmtUpdate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function parseVoiceItem(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return { name: '', qty: 1 };
  const w0 = words[0].toLowerCase();
  let qty = 1, start = 0;
  if (/^\d+$/.test(w0)) { qty = parseInt(w0, 10); start = 1; }
  else if ((w0 === 'meia' || w0 === 'meio') && /^d[uú]zia$/i.test(words[1] || '')) { qty = 6; start = 2; }
  else if (w0 === 'meia' || w0 === 'meio') { qty = 6; start = 1; }
  else if (NUMBER_WORDS[w0]) { qty = NUMBER_WORDS[w0]; start = 1; }
  if (/^de$/i.test(words[start] || '') && start > 0) start++;
  return { name: words.slice(start).join(' '), qty: Math.max(1, qty) };
}

let toastTimer;
function toast(msg, opts = {}) {
  clearTimeout(toastTimer);
  const el = $('toast');
  el.innerHTML = `<div class="toast ${opts.error ? 'err' : ''}" role="status"><span>${esc(msg)}</span>${opts.undo ? '<button data-act="undo">Anular</button>' : ''}</div>`;
  state.undo = opts.undo || null;
  toastTimer = setTimeout(() => { el.innerHTML = ''; state.undo = null; }, opts.undo ? 6000 : 3000);
}
const fail = (e) => { console.error(e); toast('Sem ligação — a alteração fica guardada e sincroniza depois.', { error: true }); };

// ---------------- Ligação ao Firebase ----------------
async function touch() {
  try { await setDoc(metaDoc(), { lastUpdated: Date.now() }, { merge: true }); } catch (e) { /* offline: sincroniza depois */ }
}

function listen() {
  onSnapshot(itemsCol(), (snap) => {
    state.items = snap.docs.map(d => ({ id: d.id, supermarket: 'geral', quantity: 1, unit: 'unid', note: '', isBought: false, createdAt: 0, ...d.data() }))
      .sort((a, b) => (a.isBought === b.isBought) ? (b.createdAt || 0) - (a.createdAt || 0) : (a.isBought ? 1 : -1));
    state.itemsReady = true; state.loading = !(state.itemsReady && state.storesReady); render();
  }, (e) => { console.error(e); toast('Erro a carregar a lista.', { error: true }); });
  onSnapshot(storesCol(), (snap) => {
    state.stores = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt'));
    state.storesReady = true; state.loading = !(state.itemsReady && state.storesReady); render();
  }, (e) => console.error(e));
  onSnapshot(metaDoc(), (snap) => { if (snap.exists()) { state.lastUpdate = snap.data().lastUpdated; renderHeader(); } }, () => {});
}

// ---------------- Ações ----------------
// Semáforos da partida: coluna k acende em 0.5s + 0.6s*k; apagam todos aos 4.6s; voltam acesos aos 5.2s
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let lightsTimer;
function lightsState() {
  const el = (Date.now() - (state.lightsStart || 0)) / 1000;
  if (reduceMotion || el >= 5.2) return { seq: false, n: 5 };
  if (el >= 4.6) return { seq: true, n: 0 };
  return { seq: true, n: Math.max(0, Math.min(5, Math.floor((el - 0.5) / 0.6) + 1)) };
}
function paintLights() {
  const box = document.querySelector('.lights'); const L = lightsState();
  if (box) { box.classList.toggle('seq', L.seq); box.querySelectorAll('i').forEach((p, k) => p.classList.toggle('on', k < L.n)); }
  if (!L.seq) { clearInterval(lightsTimer); lightsTimer = null; }
}
function startLights() {
  state.lightsStart = Date.now(); clearInterval(lightsTimer);
  lightsTimer = setInterval(paintLights, 60);
}

const getTheme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('dispensa-theme', t); } catch (e) {}
  const tc = document.getElementById('tc'); if (tc) tc.setAttribute('content', t === 'dark' ? '#050816' : '#eef1f8');
}
const themeBtn = () => `<button class="ibtn" data-act="theme" aria-label="${getTheme() === 'dark' ? 'Mudar para vista clara' : 'Mudar para vista escura'}">${icon(getTheme() === 'dark' ? 'sun' : 'moon')}</button>`;

const A = {
  theme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); renderHeader(); },
  nav(view, push = true) {
    state.view = view; state.expanded = null;
    if (view === 'dashboard') startLights();
    state.newItemStore = (view !== 'dashboard' && view !== 'all') ? view : 'geral';
    if (push) history.pushState({ view }, '');
    window.scrollTo(0, 0); render(true);
  },
  back() { if (history.state && history.state.view && history.state.view !== 'dashboard') history.back(); else A.nav('dashboard', false); },
  edit() { state.edit = !state.edit; render(); },
  openStore() { state.modal = { type: 'store', color: COLORS[0].cls }; renderModal(); setTimeout(() => document.querySelector('#modal input[name=storeName]')?.focus(), 50); },
  close() { state.modal = null; renderModal(); },
  askDelete(type, id) { state.modal = { type: 'delete', kind: type, id }; renderModal(); },
  pickColor(cls) { state.modal.color = cls; document.querySelectorAll('.sw').forEach(b => b.classList.toggle('sel', b.dataset.cls === cls)); },
  expand(id) { state.expanded = state.expanded === id ? null : id; renderMain(true); },
  setStore(id) { state.newItemStore = id; renderComposer(true); },

  saveStore(form) {
    const name = form.storeName.value.trim(); if (!name) { form.storeName.focus(); return; }
    addDoc(storesCol(), { name, color: state.modal.color, createdAt: Date.now() }).catch(fail);
    A.close();
  },
  addItem(form) {
    const input = form.elements.name; const name = input.value.trim(); if (!name) { input.focus(); return; }
    const unit = form.elements.unit.value; state.unit = unit;
    const supermarket = isSpecific() ? state.view : state.newItemStore;
    addDoc(itemsCol(), { name, quantity: 1, unit, supermarket, note: '', isBought: false, createdAt: Date.now() }).then(touch).catch(fail);
    input.value = ''; input.focus();
  },
  addVoice(name, qty, supermarket) {
    addDoc(itemsCol(), { name, quantity: qty, unit: 'unid', supermarket, note: '', isBought: false, createdAt: Date.now() }).then(touch).catch(fail);
  },
  toggle(id) { const it = state.items.find(i => i.id === id); if (!it) return; updateDoc(itemDoc(id), { isBought: !it.isBought }).then(touch).catch(fail); },
  qty(id, delta) { const it = state.items.find(i => i.id === id); if (!it) return; updateDoc(itemDoc(id), { quantity: Math.max(1, (Number(it.quantity) || 1) + delta) }).then(touch).catch(fail); },
  note(id, value) { const it = state.items.find(i => i.id === id); if (!it || (it.note || '') === value) return; updateDoc(itemDoc(id), { note: value }).then(touch).catch(fail); },
  removeItem(id) {
    const it = state.items.find(i => i.id === id); if (!it) return;
    const { id: _id, ...data } = it; state.expanded = null;
    deleteDoc(itemDoc(id)).then(touch).catch(fail);
    toast(`"${it.name}" removido`, { undo: () => setDoc(itemDoc(id), data).then(touch).catch(fail) });
  },
  async confirmDelete() {
    const { kind, id } = state.modal; state.modal = null; renderModal();
    try {
      const ops = [];
      if (kind === 'cart') state.items.filter(i => i.isBought && inView(i, state.view)).forEach(i => ops.push(b => b.delete(itemDoc(i.id))));
      else if (kind === 'store') {
        ops.push(b => b.delete(storeDoc(id)));
        state.items.filter(i => i.supermarket === id).forEach(i => ops.push(b => b.update(itemDoc(i.id), { supermarket: 'geral' })));
      }
      for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); b.commit().catch(fail); }
      touch();
    } catch (e) { fail(e); }
  },
  voice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Este browser não suporta voz.', { error: true }); return; }
    if (state.listening) { state.recognition?.stop(); return; }
    const rec = new SR(); rec.lang = 'pt-PT'; rec.continuous = true; rec.interimResults = false;
    rec.onstart = () => { state.listening = true; renderComposer(true); };
    rec.onend = () => { state.listening = false; renderComposer(true); };
    rec.onerror = (e) => { if (e.error === 'not-allowed') toast('Permite o acesso ao microfone.', { error: true }); };
    rec.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (!ev.results[i].isFinal) continue;
        const target = isSpecific() ? state.view : 'geral';
        ev.results[i][0].transcript.split(/ e |,/i).forEach(part => {
          const { name, qty } = parseVoiceItem(part);
          if (name) A.addVoice(cap(name.replace(/[.]+$/, '')), qty, target);
        });
      }
    };
    state.recognition = rec; rec.start();
  }
};

// ---------------- Renderização ----------------
let lastComposerKey = '';
function render(forceComposer) {
  renderHeader(); renderMain(); renderComposer(forceComposer); renderModal();
}

function renderHeader() {
  const el = $('hdr');
  const offline = !state.online ? `<div class="offline">${icon('wifioff')} Sem ligação — a trabalhar offline</div>` : '';
  if (state.loading) { el.innerHTML = ''; return; }
  if (state.view === 'dashboard') {
    el.innerHTML = `<div class="hdr"><div class="hdr-row">
      <img class="logo" src="icon-192.png" alt="">
      <div class="grow"><h1>Olá, <em>Ricardo</em>!</h1><p>${state.lastUpdate ? 'Atualizado ' + esc(fmtUpdate(state.lastUpdate)) : 'Pronto para a corrida?'}</p></div>
      ${themeBtn()}<button class="ibtn ${state.edit ? 'on' : ''}" data-act="edit" aria-label="Editar lojas">${icon(state.edit ? 'check' : 'edit')}</button></div>${offline}</div>`;
    return;
  }
  let label = 'Toda a lista', hex = '#0f9d6b';
  if (state.view === 'geral') { label = 'Geral / Outros'; hex = GENERAL_HEX; }
  else if (state.view !== 'all') { const s = storeById(state.view); if (s) { label = s.name; hex = colorHex(s.color); } }
  const scope = state.items.filter(i => inView(i, state.view));
  const done = scope.filter(i => i.isBought).length;
  const pct = scope.length ? Math.round(done / scope.length * 100) : 0;
  el.innerHTML = `<div class="hdr"><div class="hdr-row">
    <button class="ibtn" data-act="back" aria-label="Voltar">${icon('back')}</button>
    <div class="grow"><h1>${esc(label)}</h1><p>${scope.length - done} por comprar${done ? ` · ${done} no carrinho` : ''}</p></div>
    ${state.view !== 'all' ? `<span class="dot" style="background:${hex}"></span>` : ''}${themeBtn()}</div>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${offline}</div>`;
}

function renderMain(force) {
  const el = $('main');
  if (state.loading) { el.innerHTML = '<div class="loading"><div class="spin"></div></div>'; return; }
  // Não destruir o campo de nota enquanto se escreve
  const ae = document.activeElement;
  if (!force && ae && ae.matches && ae.matches('#main input')) { state.pendingRender = true; return; }
  state.pendingRender = false;
  el.innerHTML = '<main>' + (state.view === 'dashboard' ? dashboardHtml() : listHtml()) + '</main>';
}

function dashboardHtml() {
  if (!state.lightsStart) startLights();
  const L = lightsState();
  const open = countOpen('all'), total = state.items.length, done = total - open;
  const pct = total ? Math.round(done / total * 100) : 0;
  const tiles = state.stores.map((s, i) => {
    const n = countOpen(s.id), hex = colorHex(s.color);
    return `<div class="tile-wrap">
      <button class="tile" style="--c:${hex};animation-delay:${i * 30}ms" data-act="nav" data-view="${esc(s.id)}">
        <span class="wm">${i + 1}</span>
        <div class="top"><div class="corner"><b>${esc((s.name || '?').trim().charAt(0).toUpperCase())}</b><i>P${i + 1}</i></div>${n ? `<span class="count">${n}</span>` : ''}</div>
        <div><div class="name">${esc(s.name)}</div><div class="meta ${n ? '' : 'ok'}">${n ? `${n} ${n === 1 ? 'item' : 'itens'}` : 'Tudo comprado 🏁'}</div></div>
      </button>
      ${state.edit ? `<button class="del-badge" data-act="askDelete" data-kind="store" data-id="${esc(s.id)}" aria-label="Apagar ${esc(s.name)}">${icon('x')}</button>` : ''}
    </div>`;
  }).join('');
  const g = countOpen('geral');
  return `
    ${state.edit ? `<div class="hint">${icon('alert')} Modo de edição: toca no ✕ para apagar uma loja.</div>` : ''}
    <button class="hero" data-act="nav" data-view="all">
      <div class="lights ${L.seq ? 'seq' : ''}" aria-hidden="true">${[0, 1, 2, 3, 4].map(k => `<i class="${k < L.n ? 'on' : ''}"></i>`).join('')}</div>
      <small>Em falta</small>
      <div class="big"><b>${open}</b><span>${open === 1 ? 'item' : 'itens'} por comprar</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">${total ? `${done} de ${total} no carrinho` : 'A lista está vazia'} · ver toda a lista</div>
    </button>
    <div class="sec b"><h2>Lojas</h2></div>
    <div class="grid">
      ${tiles}
      <div class="tile-wrap"><button class="tile" style="--c:${GENERAL_HEX}" data-act="nav" data-view="geral">
        <span class="wm">//</span>
        <div class="top"><div class="corner"><b>G</b><i>PIT</i></div>${g ? `<span class="count">${g}</span>` : ''}</div>
        <div><div class="name">Geral / Outros</div><div class="meta">Sem loja definida</div></div></button></div>
      <div class="tile-wrap"><button class="tile dashed" data-act="openStore">${icon('plus')}Nova loja</button></div>
    </div>`;
}

function itemHtml(it, showStore, i) {
  const s = storeOf(it); const open = state.expanded === it.id;
  const pill = showStore ? `<span class="pill" style="background:${s ? colorHex(s.color) : GENERAL_HEX}">${esc(s ? s.name : 'Geral')}</span>` : '';
  const note = it.note ? `<span>${icon('note')} ${esc(it.note)}</span>` : '';
  return `<div class="item ${it.isBought ? 'done' : ''}" style="--c:${s ? colorHex(s.color) : GENERAL_HEX};animation-delay:${Math.min(i, 12) * 20}ms">
    <div class="item-row">
      <button class="chk" data-act="toggle" data-id="${esc(it.id)}" aria-label="${it.isBought ? 'Desmarcar' : 'Marcar como comprado'}">${icon('check')}</button>
      <div class="body" data-act="expand" data-id="${esc(it.id)}"><div class="iname">${esc(it.name)}</div>${pill || note ? `<div class="imeta">${pill}${open ? '' : note}</div>` : ''}</div>
      <div class="qty">
        <button data-act="qty" data-id="${esc(it.id)}" data-d="-1" ${it.isBought ? 'disabled' : ''} aria-label="Menos">${icon('minus')}</button>
        <div class="v">${esc(it.quantity)}<small>${esc(it.unit)}</small></div>
        <button class="plus" data-act="qty" data-id="${esc(it.id)}" data-d="1" ${it.isBought ? 'disabled' : ''} aria-label="Mais">${icon('plus')}</button>
      </div>
    </div>
    ${open ? `<div class="detail"><input type="text" data-note="${esc(it.id)}" value="${esc(it.note)}" placeholder="Adicionar nota…" maxlength="200"><button class="rm" data-act="removeItem" data-id="${esc(it.id)}" aria-label="Apagar">${icon('trash')}</button></div>` : ''}
  </div>`;
}

function listHtml() {
  const items = state.items.filter(i => inView(i, state.view));
  if (!items.length) return `<div class="empty"><div class="circle">${icon('cart')}</div><b>Lista vazia</b>Escreve ou diz o que falta comprar.</div>`;
  const active = items.filter(i => !i.isBought), bought = items.filter(i => i.isBought);
  const showStore = state.view === 'all';
  let n = 0;
  return (active.length ? `<div class="sec"><h2>Por comprar · ${active.length}</h2></div><div class="list">${active.map(i => itemHtml(i, showStore, n++)).join('')}</div>`
      : `<div class="empty" style="padding:28px 20px"><div class="circle">${icon('check')}</div><b>Tudo comprado!</b>Bandeira de xadrez! Não falta nada aqui.</div>`)
    + (bought.length ? `<div class="sec b"><h2>No carrinho · ${bought.length}</h2><button class="link" data-act="askDelete" data-kind="cart">Limpar</button></div><div class="list">${bought.map(i => itemHtml(i, showStore, n++)).join('')}</div>` : '');
}

function renderComposer(force) {
  const el = $('composer');
  if (state.loading) { el.innerHTML = ''; return; }
  const showChips = !isSpecific();
  const key = [state.view, state.listening, state.newItemStore, state.unit, state.stores.map(s => s.id + s.name + s.color).join('|')].join('#');
  if (!force && key === lastComposerKey && el.firstChild) return;
  lastComposerKey = key;
  const prev = el.querySelector('input[name=name]'); const keep = prev ? prev.value : ''; const hadFocus = prev && document.activeElement === prev;
  const chip = (id, label, hex) => { const sel = state.newItemStore === id; return `<button type="button" class="chip ${sel ? 'sel' : ''}" style="${sel ? `background:${hex}` : ''}" data-act="setStore" data-id="${esc(id)}">${esc(label)}</button>`; };
  el.innerHTML = `<form class="composer ${state.listening ? 'listening' : ''}" data-form="add" autocomplete="off">
    ${state.listening ? `<div class="listen-msg">${icon('mic')} A ouvir… diz “2 leites e pão”</div>` : ''}
    <div class="crow">
      <button type="button" class="mic ${state.listening ? 'on' : ''}" data-act="voice" aria-label="${state.listening ? 'Parar voz' : 'Adicionar por voz'}">${icon(state.listening ? 'micoff' : 'mic')}</button>
      <div class="cin"><input type="text" name="name" placeholder="${state.listening ? 'A ouvir…' : 'O que falta comprar?'}" enterkeyhint="done" ${state.listening ? 'disabled' : ''}></div>
      <button class="send" type="submit" aria-label="Adicionar" ${state.listening ? 'disabled' : ''}>${icon('plus')}</button>
    </div>
    <div class="opts">
      <div class="seg" role="radiogroup" aria-label="Unidade">
        ${['unid', 'emb', 'kg'].map(u => `<label><input type="radio" name="unit" value="${u}" ${state.unit === u ? 'checked' : ''}><span>${u === 'unid' ? 'Unid' : u === 'emb' ? 'Emb' : 'Kg'}</span></label>`).join('')}
      </div>
      ${showChips ? chip('geral', 'Geral', GENERAL_HEX) + state.stores.map(s => chip(s.id, s.name, colorHex(s.color))).join('') : ''}
    </div></form>`;
  const input = el.querySelector('input[name=name]');
  if (input && keep) input.value = keep;
  if (input && hadFocus) input.focus();
  const comp = el.firstElementChild; const h = comp ? comp.offsetHeight : 150;
  document.querySelector('main') && (document.querySelector('main').style.paddingBottom = `${h + 40}px`);
  document.documentElement.style.setProperty('--comp-h', h + 'px');
}

function renderModal() {
  const el = $('modal'); const m = state.modal;
  if (!m) { el.innerHTML = ''; return; }
  if (m.type === 'store') {
    el.innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <h3>Nova loja</h3><p>Cria um separador para organizar a lista.</p>
      <form data-form="store">
        <label class="lbl">Nome</label><input type="text" name="storeName" placeholder="Ex.: Talho, Farmácia…" maxlength="30" autocomplete="off">
        <label class="lbl">Cor</label><div class="swatches">${COLORS.map(c => `<button type="button" class="sw ${c.cls === m.color ? 'sel' : ''}" data-act="color" data-cls="${c.cls}" style="background:${c.hex}" aria-label="${c.name}"></button>`).join('')}</div>
        <div class="btns"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Criar</button></div>
      </form></div></div>`;
  } else if (m.type === 'delete') {
    const t = { cart: ['Limpar carrinho?', 'Vais remover os itens já comprados.', 'Limpar'], store: ['Apagar loja?', 'A loja é removida e os itens passam para “Geral”.', 'Apagar'] }[m.kind];
    el.innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <div class="warn">${icon('alert')}</div><h3>${t[0]}</h3><p>${t[1]}</p>
      <div class="btns"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="confirmDelete">${t[2]}</button></div></div></div>`;
  }
}

// ---------------- Eventos ----------------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('#main input')) { ae.blur(); state.pendingRender = false; }
  if (act === 'overlay') { if (e.target === t) A.close(); return; }
  const { id, view, kind, cls, d } = t.dataset;
  switch (act) {
    case 'theme': A.theme(); break; case 'nav': A.nav(view); break; case 'back': A.back(); break; case 'edit': A.edit(); break;
    case 'openStore': A.openStore(); break; case 'close': A.close(); break; case 'color': A.pickColor(cls); break;
    case 'askDelete': A.askDelete(kind, id); break; case 'confirmDelete': A.confirmDelete(); break;
    case 'toggle': A.toggle(id); break; case 'qty': A.qty(id, Number(d)); break; case 'expand': A.expand(id); break;
    case 'removeItem': A.removeItem(id); break; case 'setStore': A.setStore(id); break; case 'voice': A.voice(); break;
    case 'undo': if (state.undo) state.undo(); $('toast').innerHTML = ''; state.undo = null; break;
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'add') A.addItem(f); else if (f.dataset.form === 'store') A.saveStore(f);
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.note) A.note(e.target.dataset.note, e.target.value.trim()); });
document.addEventListener('focusout', () => { setTimeout(() => { if (state.pendingRender && !document.activeElement?.matches?.('#main input')) renderMain(); }, 50); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.modal) A.close();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-note]')) e.target.blur();
});
window.addEventListener('popstate', (e) => A.nav((e.state && e.state.view) || 'dashboard', false));
window.addEventListener('online', () => { state.online = true; renderHeader(); });
window.addEventListener('offline', () => { state.online = false; renderHeader(); });
window.addEventListener('resize', () => renderComposer(true));

// ---------------- Arranque ----------------
history.replaceState({ view: 'dashboard' }, '');
async function initAuth() {
  try {
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
    else await signInAnonymously(auth);
  } catch (e) { console.error(e); toast('Não foi possível iniciar sessão.', { error: true }); }
}
let listening = false;
onAuthStateChanged(auth, (user) => { if (user) { if (!listening) { listening = true; listen(); } } else initAuth(); });
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
